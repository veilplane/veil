#
# deb and rpm packages of veilctl (the command line for the management API), built with nfpm.
# packaging/build-packages.sh fills in the variables:
#   ARCH          amd64 or arm64
#   VERSION       the tag without "v", e.g. 1.2.3 or 1.3.0-rc.1
#   BINARY        path of the static veilctl binary for ARCH
#   COMPLETIONS   directory with veilctl.bash, _veilctl (zsh) and veilctl.fish
#   SIGNING_KEY   armored GPG private key file; empty: unsigned (test builds)
# The key's passphrase comes from NFPM_PASSPHRASE.

name: veilctl
arch: ${ARCH}
platform: linux
version: ${VERSION}
version_schema: semver
release: 1
section: admin
priority: optional
maintainer: Julian Siebert <packages@veilplane.com>
vendor: Veilplane
homepage: https://veilplane.com
license: FSL-1.1-ALv2
description: |
  Veilplane from the terminal: organizations, members, clusters, join codes, nodes, API tokens,
  the audit log and trial clusters, through the management API. Start with "veilctl login".

contents:
  - src: ${BINARY}
    dst: /usr/bin/veilctl
    file_info:
      mode: 0755
  - src: ${COMPLETIONS}/veilctl.bash
    dst: /usr/share/bash-completion/completions/veilctl
    file_info:
      mode: 0644
  - src: ${COMPLETIONS}/_veilctl
    dst: /usr/share/zsh/site-functions/_veilctl
    file_info:
      mode: 0644
  - src: ${COMPLETIONS}/veilctl.fish
    dst: /usr/share/fish/vendor_completions.d/veilctl.fish
    file_info:
      mode: 0644
  - src: LICENSE.md
    dst: /usr/share/doc/veilctl/LICENSE.md
  - src: NOTICE.md
    dst: /usr/share/doc/veilctl/NOTICE.md

rpm:
  signature:
    key_file: ${SIGNING_KEY}

deb:
  signature:
    key_file: ${SIGNING_KEY}
    type: origin
