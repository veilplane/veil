#
# Releases are created by pushing a version tag, exactly like Go modules:
#
#   git tag v1.2.3 && git push origin v1.2.3        stable release
#   git tag v1.3.0-rc.1 && git push origin v1.3.0-rc.1   pre-release
#
# The GitHub release gets the binaries veil-linux-amd64 and -arm64, the systemd unit
# veil.service, deb and rpm packages for both (signed with the package key, plus a detached .asc
# signature each), the package key's public half veil-packages.asc, checksums.txt and a Sigstore
# bundle per file. The Nix flake is built once to make sure it works (users take it from the tag).
#
# Secrets:
#   PACKAGES_GPG_KEY          armored GPG private key that signs the packages (required)
#   PACKAGES_GPG_PASSPHRASE   its passphrase
# Upload to the package server (only when the variable PACKAGES_SFTP_UPLOAD is "true"):
#   SFTP_HOST, SFTP_PORT (default 22), SFTP_USER, SFTP_PRIVATE_KEY (OpenSSH format),
#   SFTP_KNOWN_HOSTS (the server's line from ssh-keyscan, checked, never trusted on first use),
#   SFTP_DIR (the directory there; the files go to <SFTP_DIR>/<tag>/)

name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  NFPM_VERSION: v2.47.0
  NIX_VERSION: 2.35.4

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    name: Check version tag
    runs-on: ubuntu-24.04
    steps:
      - name: Check that the tag is a semantic version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if ! [[ "$TAG" =~ $semver ]]; then
            echo "::error::Tag '$TAG' is not a semantic version like v1.2.3 or v1.3.0-rc.1"
            exit 1
          fi
          echo "Releasing $TAG"

  tests:
    name: Tests
    needs: [check-version]
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  github-release:
    name: Create GitHub release with binaries and packages
    needs: [tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release
      id-token: write # keyless signing with Sigstore
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build static binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" -o "dist/veil-linux-$arch" ./cmd/veil
          done
          cp LICENSE.md NOTICE.md packaging/veil.service dist/

      - name: Import the package signing key
        env:
          PACKAGES_GPG_KEY: ${{ secrets.PACKAGES_GPG_KEY }}
        run: |
          if [ -z "$PACKAGES_GPG_KEY" ]; then
            echo "::error::secret PACKAGES_GPG_KEY is missing: packages are only released signed"
            exit 1
          fi
          umask 077
          printf '%s\n' "$PACKAGES_GPG_KEY" > "$RUNNER_TEMP/packages-key.asc"
          gpg --batch --import "$RUNNER_TEMP/packages-key.asc"
          gpg --batch --armor --export > dist/veil-packages.asc
          gpg --batch --list-keys --keyid-format long

      - name: Build signed deb and rpm packages
        env:
          VERSION: ${{ github.ref_name }}
          NFPM_PASSPHRASE: ${{ secrets.PACKAGES_GPG_PASSPHRASE }}
        run: |
          go install "github.com/goreleaser/nfpm/v2/cmd/nfpm@${NFPM_VERSION}"
          SIGNING_KEY="$RUNNER_TEMP/packages-key.asc" packaging/build-packages.sh "$VERSION" "$PWD/dist"

      - name: Detached GPG signatures of the packages
        env:
          PASSPHRASE: ${{ secrets.PACKAGES_GPG_PASSPHRASE }}
        run: |
          for f in dist/*.deb dist/*.rpm; do
            printf '%s' "$PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
              --armor --detach-sign --output "$f.asc" "$f"
            gpg --batch --verify "$f.asc" "$f"
          done
          rm -f "$RUNNER_TEMP/packages-key.asc"

      - name: Checksums
        run: (cd dist && sha256sum -- veil-linux-* veil.service veil-packages.asc ./*.deb ./*.rpm | sed "s| \./| |" > checksums.txt)

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign everything with Sigstore (keyless)
        run: |
          cd dist
          for f in veil-linux-amd64 veil-linux-arm64 veil.service veil-packages.asc *.deb *.rpm checksums.txt; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          [[ "$TAG" == *-* ]] && prerelease="--prerelease"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes $prerelease dist/*

  nix:
    name: Nix flake builds
    needs: [tests]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix ${{ env.NIX_VERSION }}
        run: |
          sh <(curl -fsSL "https://nixos.org/releases/nix/nix-${NIX_VERSION}/install") --no-daemon
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"

      - name: Build the package
        run: nix --extra-experimental-features 'nix-command flakes' build .#veil --print-build-logs

  sftp-upload:
    name: Upload packages to the package server
    needs: [github-release, nix]
    if: vars.PACKAGES_SFTP_UPLOAD == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Download the release's packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir upload
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir upload \
            --pattern '*.deb' --pattern '*.rpm' --pattern '*.asc' --pattern '*.sigstore.json' --pattern 'checksums.txt'
          (cd upload && sha256sum --ignore-missing -c checksums.txt)

      - name: Upload with sftp
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PRIVATE_KEY: ${{ secrets.SFTP_PRIVATE_KEY }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
          SFTP_DIR: ${{ secrets.SFTP_DIR }}
          TAG: ${{ github.ref_name }}
        run: |
          for v in SFTP_HOST SFTP_USER SFTP_PRIVATE_KEY SFTP_KNOWN_HOSTS SFTP_DIR; do
            [ -n "${!v}" ] || { echo "::error::secret $v is missing"; exit 1; }
          done
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SFTP_PRIVATE_KEY" > ~/.ssh/upload_key
          printf '%s\n' "$SFTP_KNOWN_HOSTS" > ~/.ssh/known_hosts
          {
            echo "-mkdir $SFTP_DIR/$TAG"
            for f in upload/*; do echo "put $f $SFTP_DIR/$TAG/"; done
          } > "$RUNNER_TEMP/sftp-batch"
          sftp -b "$RUNNER_TEMP/sftp-batch" -i ~/.ssh/upload_key -P "${SFTP_PORT:-22}" \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o BatchMode=yes \
            "$SFTP_USER@$SFTP_HOST"
          rm -f ~/.ssh/upload_key
