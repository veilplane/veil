# Copyright 2026 Julian Siebert. See LICENSE.md.
#
# Releases are created by pushing a version tag, exactly like Go modules:
#
#   git tag v1.2.3 && git push origin v1.2.3        stable release
#   git tag v1.3.0-rc.1 && git push origin v1.3.0-rc.1   pre-release
#
# The GitHub release gets the binaries veil-linux-amd64 and -arm64, veilctl for Linux, macOS and
# Windows (veilctl-{linux,darwin}-{amd64,arm64}, veilctl-windows-{amd64,arm64}.exe), the systemd
# unit veil.service, deb and rpm packages of veil and veilctl (signed with the package key, plus a
# detached .asc signature each), the package key's public half veil-packages.asc, checksums.txt
# and a Sigstore bundle per file. The Nix flake is built once to make sure it works (users take it from the tag).
#
# Secrets:
#   PACKAGES_GPG_KEY          armored GPG private key that signs the packages (required)
#   PACKAGES_GPG_PASSPHRASE   its passphrase
# After a stable release, packages.yml rebuilds the apt and dnf repository on GitHub Pages.

name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  NFPM_VERSION: v2.47.0
  NIX_VERSION: 2.35.4

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    name: Check version tag
    runs-on: ubuntu-26.04
    steps:
      - name: Check that the tag is a semantic version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if ! [[ "$TAG" =~ $semver ]]; then
            echo "::error::Tag '$TAG' is not a semantic version like v1.2.3 or v1.3.0-rc.1"
            exit 1
          fi
          echo "Releasing $TAG"

  tests:
    name: Tests
    needs: [check-version]
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  github-release:
    name: Create GitHub release with binaries and packages
    needs: [tests]
    runs-on: ubuntu-26.04
    permissions:
      contents: write # create the release
      id-token: write # keyless signing with Sigstore
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Veilplane's attestation key is built in (without it, veil would trust no backend)
        run: go test -tags release -run TestProductionKeys ./agent

      - name: Build static binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" -o "dist/veil-linux-$arch" ./cmd/veil
            for os in linux darwin windows; do
              ext=""
              [ "$os" = windows ] && ext=.exe
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
                -ldflags "-s -w -X main.version=${VERSION}" -o "dist/veilctl-$os-$arch$ext" ./cmd/veilctl
            done
          done
          cp LICENSE.md NOTICE.md packaging/veil.service dist/

      - name: Import the package signing key
        env:
          PACKAGES_GPG_KEY: ${{ secrets.PACKAGES_GPG_KEY }}
        run: |
          if [ -z "$PACKAGES_GPG_KEY" ]; then
            echo "::error::secret PACKAGES_GPG_KEY is missing: packages are only released signed"
            exit 1
          fi
          umask 077
          printf '%s\n' "$PACKAGES_GPG_KEY" > "$RUNNER_TEMP/packages-key.asc"
          gpg --batch --import "$RUNNER_TEMP/packages-key.asc"
          gpg --batch --armor --export > dist/veil-packages.asc
          gpg --batch --list-keys --keyid-format long

      - name: Install nfpm ${{ env.NFPM_VERSION }} (release binary, checksum checked)
        run: |
          v=${NFPM_VERSION#v}
          base="https://github.com/goreleaser/nfpm/releases/download/${NFPM_VERSION}"
          mkdir -p "$RUNNER_TEMP/nfpm" && cd "$RUNNER_TEMP/nfpm"
          curl -fsSLO "$base/nfpm_${v}_Linux_x86_64.tar.gz"
          curl -fsSLO "$base/checksums.txt"
          grep " nfpm_${v}_Linux_x86_64.tar.gz\$" checksums.txt | sha256sum -c -
          tar xzf "nfpm_${v}_Linux_x86_64.tar.gz" nfpm
          echo "$RUNNER_TEMP/nfpm" >> "$GITHUB_PATH"

      - name: Build signed deb and rpm packages
        env:
          VERSION: ${{ github.ref_name }}
          NFPM_PASSPHRASE: ${{ secrets.PACKAGES_GPG_PASSPHRASE }}
        run: |
          SIGNING_KEY="$RUNNER_TEMP/packages-key.asc" packaging/build-packages.sh "$VERSION" "$PWD/dist"

      - name: Detached GPG signatures of the packages
        env:
          PASSPHRASE: ${{ secrets.PACKAGES_GPG_PASSPHRASE }}
        run: |
          for f in dist/*.deb dist/*.rpm; do
            printf '%s' "$PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
              --armor --detach-sign --output "$f.asc" "$f"
            gpg --batch --verify "$f.asc" "$f"
          done
          rm -f "$RUNNER_TEMP/packages-key.asc"

      - name: Checksums
        run: (cd dist && sha256sum -- veil-linux-* veilctl-* veil.service veil-packages.asc ./*.deb ./*.rpm | sed "s| \./| |" > checksums.txt)

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign everything with Sigstore (keyless)
        run: |
          cd dist
          for f in veil-linux-amd64 veil-linux-arm64 veilctl-* veil.service veil-packages.asc *.deb *.rpm checksums.txt; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          [[ "$TAG" == *-* ]] && prerelease="--prerelease"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes $prerelease dist/*

  nix:
    name: Nix flake builds
    needs: [tests]
    runs-on: ubuntu-26.04
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix ${{ env.NIX_VERSION }}
        run: |
          sh <(curl -fsSL "https://nixos.org/releases/nix/nix-${NIX_VERSION}/install") --no-daemon
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"

      - name: Build the package
        run: |
          nix --extra-experimental-features 'nix-command flakes' build .#veil --print-build-logs
          nix --extra-experimental-features 'nix-command flakes' build .#veilctl --print-build-logs

  package-repository:
    name: Package repository
    needs: [github-release, nix]
    if: ${{ !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/packages.yml
    permissions:
      contents: write
    secrets: inherit
